
    <h2>Room Properties</h2>
    <div class="fields">
      <label>X Position
        <input id="roomX" type="number" value="0" min="0">
      </label>
      <label>Y Position
        <input id="roomY" type="number" value="0" min="0">
      </label>
      <label>Length
        <input id="editLength" type="number" value="12" min="4">
      </label>
      <label>Breadth
        <input id="editBreadth" type="number" value="10" min="4">
      </label>
    </div>

  <section class="panel">
    <div class="toolbar">
      <button id="undo">↶ Undo</button>
      <button id="redo">↷ Redo</button>

      <button id="loadDesign">Load</button>

    </div>

  <section class="panel">

      <button id="reset3D">Reset Camera</button>
    </div>
    <div id="house3D"></div>
    <p id="status3D" aria-live="polite">3D preview ready nahi hai.</p>
  </section>
